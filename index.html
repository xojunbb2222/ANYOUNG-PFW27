<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Wonyoung & Yujin PFW Copy Generator</title>
<style>
:root{--bg:#171b2b;--panel:#101522;--text:#fff;--muted:#aeb7cc;--pink:#ff6fa8;--pink-deep:#c12c63;--pink-soft:#3a1830;--blue:#9fd8ff;--blue-deep:#4aa9ea;--blue-soft:#173247}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:30px 42px 46px}
.hero{text-align:center;margin-bottom:28px}
.sparkle{display:none}
h1{margin:0;font-size:22px;letter-spacing:.09em;font-weight:800;color:#ff7baa;text-transform:uppercase}
.subtitle{margin-top:8px;color:#d7dceb;font-size:12px;letter-spacing:.09em;text-transform:uppercase}
.panel{background:transparent;border:0;padding:0;box-shadow:none}
.result-head{display:none}
.output-wrap{position:relative;margin-top:32px}
.output-badge{position:absolute;top:-12px;left:18px;z-index:2;background:var(--pink-deep);color:#fff;border-radius:999px;padding:7px 16px;font-size:12px;font-weight:800}
.output{min-height:178px;border:1.5px solid var(--pink-deep);border-radius:10px;background:var(--panel);padding:54px 32px 30px;display:flex;align-items:center;justify-content:flex-start;text-align:left;white-space:pre-wrap;font-size:15px;line-height:1.55;color:#fff}
.copy-btn{position:absolute;top:14px;right:14px;z-index:2;border:0;background:var(--pink);color:#fff;border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:800;font-size:12px}
.random-title{text-align:center;font-size:12px;font-weight:800;margin:25px 0 12px;letter-spacing:.03em;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gen{border:1.5px solid transparent;border-radius:7px;padding:12px 14px;cursor:pointer;font-weight:800;font-size:14px;min-height:42px;color:#fff;transition:.15s ease}
.gen:hover{transform:translateY(-1px);filter:brightness(1.06)}
.gen[data-person="wonyoung"]{background:var(--pink-deep);border-color:#ff8eb8}
.gen[data-person="yujin"]{background:#4d99c7;border-color:#b3e2ff}
.gen.active[data-person="wonyoung"]{background:#d93473;box-shadow:0 0 0 2px rgba(255,111,168,.18)}
.gen.active[data-person="yujin"]{background:#57aee2;box-shadow:0 0 0 2px rgba(159,216,255,.18)}
.note{margin-top:15px;text-align:center;font-size:11px;line-height:1.5;color:var(--muted)}
.footer{text-align:center;color:#768198;font-size:10px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);opacity:0;background:#fff;color:#111;padding:9px 14px;border-radius:999px;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:620px){.wrap{padding:24px 18px 38px}.grid{grid-template-columns:1fr}.output{min-height:190px;padding:56px 22px 26px;font-size:14px}h1{font-size:18px}.copy-btn{top:13px;right:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>✨ PARIS FASHION WEEK 2027 ✨</h1>
    <div class="subtitle">Wonyoung × Dior · Yujin × Lacoste</div>
  </div>

  <div class="panel">
    <div class="result-head">
      <div class="result-title" id="modeLabel">Wonyoung Comments</div>
      <button class="copy-btn" id="copyBtn">📄 Copy</button>
    </div>

    <div class="output" id="output"></div>

    <div class="random-title">CLICK TO RANDOM</div>

    <div class="grid">
      <button class="gen active" data-person="wonyoung" data-type="comments">Wonyoung Comments</button>
      <button class="gen" data-person="yujin" data-type="comments">Yujin Comments</button>
      <button class="gen" data-person="wonyoung" data-type="captions">Wonyoung Captions</button>
      <button class="gen" data-person="yujin" data-type="captions">Yujin Captions</button>
    </div>

    <div class="note">Comments are generated without hashtags. Captions automatically include the correct tags for each member and brand.</div>
  </div>

  <div class="footer">Fan-made random copy generator</div>
</div>
<div class="toast" id="toast">Copied!</div>

<script>
const content={
  wonyoung:{
    comments:[
      "Wonyoung looks absolutely stunning — Dior suits her elegance so naturally.",
      "Jang Wonyoung and Dior are such a perfect match. The elegance is effortless.",
      "Her fashion presence is incredible. Every detail looks refined and intentional.",
      "Wonyoung makes every fashion week appearance feel like a major moment.",
      "Dior really chose the right person — Wonyoung carries this look beautifully.",
      "Her proportions, expression and confidence make this entire look unforgettable.",
      "Wonyoung has that rare ability to make high fashion feel both elegant and fresh.",
      "This styling fits Wonyoung perfectly. She looks polished from every angle.",
      "She doesn't just wear the look, she gives it a whole mood of its own.",
      "Wonyoung's camera presence is on another level. She makes every frame memorable.",
      "Thank you Dior for inviting Wonyoung. This collaboration feels so natural.",
      "The combination of Dior and Wonyoung is exactly the kind of fashion moment I wanted to see.",
      "Wonyoung's elegance feels completely effortless here.",
      "Another fashion week, another iconic Wonyoung moment.",
      "She looks graceful, confident and incredibly sophisticated."
    ],
    captions:[
      "Thank you Dior for inviting Jang Wonyoung to Paris Fashion Week. Her elegant image and strong fashion presence make this collaboration feel especially exciting.",
      "Wonyoung and Dior feel like such a natural match. Her refined aura brings the look to life while still keeping her own unmistakable charm.",
      "Jang Wonyoung once again shows why she stands out in fashion. Elegant, polished and confident from every angle.",
      "A beautiful meeting of Dior's timeless elegance and Wonyoung's modern star power. Every detail feels perfectly balanced.",
      "Wonyoung turns every fashion appearance into a moment worth remembering. Can't wait to see more from her time with Dior in Paris.",
      "Dior chose well. Wonyoung's presence is graceful, modern and instantly recognizable — exactly the kind of energy that shines at Paris Fashion Week.",
      "From the styling to her expressions, Wonyoung makes the whole look feel effortless. This Dior moment is already one to remember.",
      "Jang Wonyoung continues to prove how naturally she fits the fashion world. Her poise and visual impact are impossible to ignore.",
      "Wonyoung brings her own elegant energy to Dior and makes every frame feel special. Such a beautiful fashion week moment.",
      "Paris Fashion Week looks even brighter with Wonyoung there. Thank you Dior for giving us this gorgeous moment."
    ]
  },
  yujin:{
    comments:[
      "Yujin looks so confident and fresh — Lacoste matches her sporty chic energy perfectly.",
      "An Yujin brings such a cool, effortless presence to this Lacoste look.",
      "Lacoste and Yujin are such a strong match. She makes the styling feel young and dynamic.",
      "Yujin's confidence makes every shot feel alive. She looks incredible.",
      "This sporty yet polished concept suits An Yujin so well.",
      "Her expressions are so natural and charismatic. Yujin really owns this look.",
      "An Yujin has the perfect balance of elegance, energy and confidence.",
      "She makes Lacoste feel fresh, modern and full of personality.",
      "Yujin's presence is so strong without ever looking forced.",
      "This styling brings out Yujin's cool and energetic side perfectly.",
      "Thank you Lacoste for inviting An Yujin. She fits the brand's energy so well.",
      "Yujin makes sporty fashion look incredibly chic and effortless.",
      "Her bright confidence is exactly what makes this appearance stand out.",
      "An Yujin at Paris Fashion Week is the moment. She looks amazing.",
      "Lacoste really found the perfect ambassador for this fresh, confident mood."
    ],
    captions:[
      "Thank you Lacoste for inviting An Yujin to Paris Fashion Week. Her confident and energetic image fits the brand's sporty elegance so naturally.",
      "An Yujin brings such a fresh and dynamic energy to Lacoste. Sporty, polished and effortlessly cool all at once.",
      "Yujin's strongest fashion moments always feel natural, and this Lacoste look is a perfect example — confident, clean and full of personality.",
      "Lacoste and An Yujin are a great match. Her bright charisma gives the styling an energetic and modern edge.",
      "Yujin makes every frame feel alive. Her confidence, expressions and effortless presence make this Paris Fashion Week appearance so memorable.",
      "A perfect mix of sporty chic and star power. An Yujin brings her own energy to Lacoste in the best way.",
      "From her posture to her expressions, Yujin gives this Lacoste look so much character. She looks confident and completely at ease.",
      "An Yujin continues to show how versatile her fashion presence can be. This fresh Lacoste styling suits her perfectly.",
      "Paris Fashion Week with An Yujin and Lacoste feels energetic, modern and effortlessly stylish.",
      "Thank you Lacoste for giving us another beautiful An Yujin fashion moment. She makes the whole look feel instantly memorable."
    ]
  }
};

const tags={
  wonyoung:"#JANGWONYOUNG #WONYOUNG
#diorsummer27 @Dior",
  yujin:"#ANYUJIN #LACOSTE
#LacosteSS27 #PFW"
};

let state={person:"wonyoung",type:"comments",index:-1};
const output=document.getElementById('output');
const modeLabel=document.getElementById('modeLabel');

function label(){return (state.person==='wonyoung'?'Wonyoung':'Yujin')+' '+(state.type==='comments'?'Comments':'Captions');}
function buildText(raw){return state.type==='comments'?raw:raw+'\n\n'+tags[state.person];}
function applyTheme(){
  const wrap=document.querySelector('.output-wrap');
  const copy=document.getElementById('copyBtn');
  if(state.person==='wonyoung'){
    modeLabel.style.background='var(--pink-deep)';
    output.style.borderColor='var(--pink-deep)';
    copy.style.background='var(--pink)';
  }else{
    modeLabel.style.background='#4d99c7';
    output.style.borderColor='#77bce7';
    copy.style.background='#6db6e4';
  }
}
function randomize(){
  const arr=content[state.person][state.type];
  let i=Math.floor(Math.random()*arr.length);
  if(arr.length>1 && i===state.index) i=(i+1)%arr.length;
  state.index=i;
  output.textContent=buildText(arr[i]);
  modeLabel.textContent=label();
  applyTheme();
}

document.querySelectorAll('.gen').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.gen').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  state.person=btn.dataset.person; state.type=btn.dataset.type; state.index=-1; randomize();
}));


document.getElementById('copyBtn').addEventListener('click',async()=>{
  const text=output.textContent;
  try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
  const toast=document.getElementById('toast');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1000);
});

randomize();
</script>
</body>
</html>
