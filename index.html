function pick(a){return a[Math.floor(Math.random()*a.length)]}
function maybe(prob){return Math.random()<prob}
function addEmoji(text,b,mode){
  if(!maybe(mode==='comments'?0.72:0.6)) return text;
  const e=pick(b.emoji); return e ? text+" "+e : text;
}
function humanize(text){
  text=text.replace(/\s+/g,' ').trim();
  if(maybe(.18)) text=text.replace(/\.$/,'');
  if(maybe(.22)) text=text.charAt(0).toLowerCase()+text.slice(1);
  return text;
}
function makeComment(person){
  const b=phraseBanks[person], n=pick(b.names), who=person==='wonyoung'?'wonyoung':'yujin';
  const directions=[b.brandMatch,b.interpretation,b.fashionPower,b.brandChoice];
  const a=pick(pick(directions));
  let c=pick(pick(directions));
  if(c===a) c=pick(b.reactions);
  const templates=[
    ()=>`${a}. ${pick(b.reactions)}`,
    ()=>`${pick(b.details)}??? ${pick(b.reactions)}`,
    ()=>`${a} and ${c}`,
    ()=>`${pick(b.parisBits)}. ${a}`,
    ()=>`${who} please 😭 ${pick(b.details)} is TOO good`,
    ()=>`no because ${pick(b.details)}... ${pick(b.reactions)}`,
    ()=>`${pick(b.reactions)} — ${a}`,
    ()=>`${n} really said fashion week and meant it`,
    ()=>`the way ${pick(b.details)} pulls the whole look together >>>`,
    ()=>`${pick(b.looks)}. that's it. that's the tweet`,
    ()=>`this might be one of my favorite ${who} looks lately`,
    ()=>`${pick(b.details)} + ${pick(b.details)} = perfection`,
    ()=>`${pick(b.brandChoice)} because ${pick(b.interpretation)}`,
    ()=>`${pick(b.fashionPower)} and this look proves it again`,
    ()=>`${pick(b.brandMatch)}. like... obviously`,
    ()=>`${pick(b.interpretation)}. that's why this pairing works for me`,
    ()=>`not to be dramatic but ${pick(b.brandChoice).toLowerCase()}`,
    ()=>`${pick(b.fashionPower)} ${pick(b.emoji)}`
  ];
  return addEmoji(humanize(pick(templates)()),b,'comments');
}
function makeCaption(person){
  const b=phraseBanks[person];
  const joiners=[" — ",". ","... "," 🤍 "," ✨ "," and honestly "," / "];
  const one=pick(b.brandMatch), two=pick(b.interpretation), three=pick(b.fashionPower), four=pick(b.brandChoice);
  const styles=[
    ()=>`${pick(b.captionOpen)}${pick(joiners)}${one}. ${pick(b.captionEnd)}`,
    ()=>`${pick(b.captionOpen)} and honestly ${two}. ${pick(b.captionEnd)}`,
    ()=>`${three}. ${one}. ${pick(b.captionEnd)}`,
    ()=>`${pick(b.parisBits)}. ${two}. ${pick(b.captionEnd)}`,
    ()=>`${pick(b.captionOpen)}. ${pick(b.details)} is my favorite part, but ${three.toLowerCase()}`,
    ()=>`${one}, and ${two}. ${pick(b.captionEnd)}`,
    ()=>`${pick(b.captionOpen)}!!! ${three}. ${pick(b.reactions)}`,
    ()=>`${pick(b.captionOpen)} — ${four}. ${pick(b.captionEnd)}`,
    ()=>`${four}. ${one}, and she really makes the whole thing feel natural`,
    ()=>`${two}. ${three}. that's why this look works so well`,
    ()=>`${one}. ${four}. honestly a win for everyone involved`,
    ()=>`${pick(b.captionOpen)} — ${three}, but what i love most is how ${two.toLowerCase()}`,
    ()=>`${four}. she doesn't just wear the brand, ${two.toLowerCase()}`,
    ()=>`${pick(b.parisBits)} and ${one.toLowerCase()}. ${pick(b.reactions)}`,
    ()=>`${three}. add ${one.toLowerCase()} and yeah... this was always going to work`,
    ()=>`${pick(b.captionOpen)} ${pick(b.emoji)} ${two}. ${pick(b.captionEnd)}`
  ];
  let text=humanize(pick(styles)());
  if(maybe(.32)) text=text.replace(/\. /g,'.\n');
  return addEmoji(text,b,'captions');
}
const usedCache={};
function storageKey(person,type){return `pfw_used_${person}_${type}`}
function getUsed(person,type){
  const k=storageKey(person,type);
  if(!usedCache[k]){try{usedCache[k]=new Set(JSON.parse(localStorage.getItem(k)||'[]'))}catch(e){usedCache[k]=new Set()}}
  return usedCache[k];
}
function uniqueGenerated(person,type){
  const used=getUsed(person,type);
  let text='';
  for(let tries=0;tries<200;tries++){
    text=type==='comments'?makeComment(person):makeCaption(person);
    if(!used.has(text)) break;
  }
  used.add(text);
  if(used.size>5000){const arr=[...used].slice(-4000);used.clear();arr.forEach(x=>used.add(x));}
  try{localStorage.setItem(storageKey(person,type),JSON.stringify([...used]))}catch(e){}
  return text;
}

let state={person:"wonyoung",type:"comments"};
const output=document.getElementById('output');
const modeLabel=document.getElementById('modeLabel');
function label(){return (state.person==='wonyoung'?'Wonyoung':'Yujin')+' '+(state.type==='comments'?'Comments':'Captions');}
function applyTheme(){
  const copy=document.getElementById('copyBtn');
  if(state.person==='wonyoung'){
    modeLabel.style.background='var(--pink-deep)';
    output.style.borderColor='var(--pink-deep)';
    copy.style.background='var(--pink)';
  }else{
    modeLabel.style.background='var(--blue-deep)';
    output.style.borderColor='var(--blue-deep)';
    copy.style.background='var(--blue)';
  }
}
function randomize(){
  const raw=uniqueGenerated(state.person,state.type);
  output.textContent=state.type==='comments'?raw:raw+'\n\n'+tags[state.person];
  modeLabel.textContent=label();
  applyTheme();
}
document.querySelectorAll('.gen').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.gen').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  state.person=btn.dataset.person;
  state.type=btn.dataset.type;
  randomize();
}));
document.getElementById('copyBtn').addEventListener('click',async()=>{
  const text=output.textContent;
  try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
  const toast=document.getElementById('toast');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1000);
});
randomize();
